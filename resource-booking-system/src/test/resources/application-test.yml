spring:
  datasource:
    url: jdbc:h2:mem:resource_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-key-for-jwt-tests-must-be-at-least-32-characters
    expiration-ms: 3600000
